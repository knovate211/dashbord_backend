services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillofide
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skillofide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillofide"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    ports:
      # Host port 6380, not 6379: another local project (b4igo-redis) holds
      # 6379, and the clash left this whole stack half-started. Containers
      # still reach Redis at redis:6379; only host tools use 6380.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: "--jetstream --http_port 8222 --store_dir /data"
    ports:
      - "4222:4222"   # client port
      - "8222:8222"   # monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A local inbox. Catches every email the stack sends and shows them at
  # http://localhost:8025 — so the scholarship link, the staff alert and the
  # password-reset code can all be read without wiring a real mail account, and
  # without any risk of a test run emailing a real candidate.
  #
  # Development only. Production points SMTP_HOST at a real relay.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  db-migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./services/problem-service/migrations:/migrations/problem-service:ro
      - ./services/submission-service/migrations:/migrations/submission-service:ro
      - ./services/progress-service/migrations:/migrations/progress-service:ro
      - ./services/assessment-service/migrations:/migrations/assessment-service:ro
    entrypoint:
      - sh
      - -c
      - |
        /migrate -path=/migrations/problem-service -database 'postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable&x-migrations-table=schema_migrations_problem' up && \
        /migrate -path=/migrations/submission-service -database 'postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable&x-migrations-table=schema_migrations_submission' up && \
        /migrate -path=/migrations/progress-service -database 'postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable&x-migrations-table=schema_migrations_progress' up && \
        /migrate -path=/migrations/assessment-service -database 'postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable&x-migrations-table=schema_migrations_assessment' up
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Microservices ────────────────────────────────────────────────────────────
  problem-service:
    build:
      context: .
      dockerfile: services/problem-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable
      REDIS_ADDR: redis:6379
      GRPC_PORT: "50051"
      LOG_LEVEL: info
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  execution-service:
    build:
      context: .
      dockerfile: services/execution-service/Dockerfile
    restart: unless-stopped
    environment:
      # Allowance added to every time limit for container start and interpreter
      # boot, which the judge's clock would otherwise charge to the candidate.
      # Raise it on a slow or busy host; near-zero is right on a dedicated
      # Linux runner.
      EXEC_STARTUP_GRACE_MS: ${EXEC_STARTUP_GRACE_MS:-3000}
      # How many sandboxed runs may execute at once. Each is pinned to one CPU,
      # so oversubscribing does not add throughput — it makes every run slow
      # enough to fail its time limit. Defaults to CPUs-2.
      EXEC_MAX_CONCURRENT: ${EXEC_MAX_CONCURRENT:-}
      PROBLEM_SERVICE_ADDR: problem-service:50051
      NATS_URL: nats://nats:4222
      GRPC_PORT: "50052"
      LOG_LEVEL: info
    ports:
      - "50052:50052"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker for sandbox
    depends_on:
      nats:
        condition: service_healthy
      problem-service:
        condition: service_started

  submission-service:
    build:
      context: .
      dockerfile: services/submission-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable
      NATS_URL: nats://nats:4222
      PROGRESS_SERVICE_ADDR: progress-service:50054
      GRPC_PORT: "50053"
      LOG_LEVEL: info
    ports:
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  progress-service:
    build:
      context: .
      dockerfile: services/progress-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable
      REDIS_ADDR: redis:6379
      GRPC_PORT: "50054"
      LOG_LEVEL: info
    ports:
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      HTTP_PORT: "8081"
      LOG_LEVEL: info
    ports:
      - "8085:8081"
    depends_on:
      nats:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable
      GRPC_PORT: "50055"
      LOG_LEVEL: info
    ports:
      - "50055:50055"
    depends_on:
      postgres:
        condition: service_healthy

  assessment-service:
    build:
      context: .
      dockerfile: services/assessment-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable
      NATS_URL: nats://nats:4222
      SUBMISSION_SERVICE_ADDR: submission-service:50053
      EXECUTION_SERVICE_ADDR: execution-service:50052
      GRPC_PORT: "50056"
      SWEEP_INTERVAL_SECONDS: "30"
      LOG_LEVEL: info
    ports:
      - "50056:50056"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      submission-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
      PROBLEM_SERVICE_ADDR: problem-service:50051
      SUBMISSION_SERVICE_ADDR: submission-service:50053
      EXECUTION_SERVICE_ADDR: execution-service:50052
      PROGRESS_SERVICE_ADDR: progress-service:50054
      USER_SERVICE_ADDR: user-service:50055
      ASSESSMENT_SERVICE_ADDR: assessment-service:50056
      NOTIFICATION_SERVICE_URL: http://notification-service:8081
      JWT_SECRET: dev-secret-change-in-production
      # 5173 = skillofied-app, 5174 = admin-panel, 5176 = skillofied-frontend,
      # 3000 = knovate-web (marketing site: enquiry form + scholarship apply)
      ALLOWED_ORIGINS: "https://d12z9kppz632u1.cloudfront.net,http://localhost:5173,http://localhost:5174,http://localhost:5176,http://localhost:3000"
      DATABASE_URL: postgres://skillofide:password@postgres:5432/skillofide?sslmode=disable
      DEV_MODE: "true"
      LOG_LEVEL: info
      # RapidAPI key for JSearch, backing the Placement job board.
      JSEARCH_API_KEY: ${JSEARCH_API_KEY}
      # Enquiry alerts. Leave SMTP_HOST empty to disable — enquiries are still
      # captured, they are just logged instead of emailed.
      # Defaults point at the local mailpit inbox so email works out of the box
      # in development and nothing can reach a real address. Override all five
      # for production.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@knovate.local}
      INQUIRY_NOTIFY_TO: ${INQUIRY_NOTIFY_TO:-admissions@knovate.local}
      # Where a scholarship applicant is redirected to sit their test. The claim
      # link is built from this, so in production it must be the test portal's
      # public origin — a wrong value sends every applicant nowhere.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # Staff alerts for new scholarship applications. Falls back to
      # INQUIRY_NOTIFY_TO when unset.
      SCHOLARSHIP_NOTIFY_TO: ${SCHOLARSHIP_NOTIFY_TO:-admissions@knovate.local}
      # Online course purchase (Razorpay). Leave the keys empty to keep online
      # payment off — the site then offers "request a callback" instead. Use
      # rzp_test_ keys until the flow is checked end to end. The webhook
      # secret is the one set on the Razorpay dashboard webhook for
      # <api>/api/enroll/webhook (events: payment.captured, order.paid).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Rate limits on the public forms. Per-IP limits are OFF (0) by default:
      # a whole campus shares one NAT address, and an IP cap blocks real
      # students on drive day. Abuse is stopped per email instead (and by the
      # honeypot on the forms). Set an *_IP_LIMIT above 0 only if a flood from
      # a single address ever needs stopping.
      SCHOLARSHIP_IP_LIMIT: ${SCHOLARSHIP_IP_LIMIT:-0}
      SCHOLARSHIP_EMAIL_LIMIT: ${SCHOLARSHIP_EMAIL_LIMIT:-5}
      INQUIRY_IP_LIMIT: ${INQUIRY_IP_LIMIT:-0}
      INQUIRY_EMAIL_LIMIT: ${INQUIRY_EMAIL_LIMIT:-5}
      ENROLL_IP_LIMIT: ${ENROLL_IP_LIMIT:-0}
      ENROLL_EMAIL_LIMIT: ${ENROLL_EMAIL_LIMIT:-10}
      PASSWORD_RESET_IP_LIMIT: ${PASSWORD_RESET_IP_LIMIT:-}
      PASSWORD_RESET_EMAIL_LIMIT: ${PASSWORD_RESET_EMAIL_LIMIT:-5}
      SCHOLARSHIP_IP_WINDOW_MIN: ${SCHOLARSHIP_IP_WINDOW_MIN:-10}
      # How often to retire scholarship links that lapsed unused, in minutes.
      SCHOLARSHIP_SWEEP_MIN: ${SCHOLARSHIP_SWEEP_MIN:-15}
    ports:
      - "8080:8080"
    depends_on:
      - problem-service
      - submission-service
      - execution-service
      - progress-service
      - notification-service
      - user-service
      - assessment-service

volumes:
  postgres_data:
  nats_data:
