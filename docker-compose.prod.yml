# ==========================================================================
# Production docker-compose overrides for dashbord_backend
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# RDS Endpoint: skillofide-db.czisgkemmwll.ap-south-1.rds.amazonaws.com
# All secrets come from environment variables.
# ==========================================================================

services:
  # ─── Infrastructure overrides ─────────────────────────────────────────────
  postgres:
    # Disable local postgres in production to save resource since we use Amazon RDS.
    deploy:
      replicas: 0

  db-migrate:
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
    entrypoint:
      - sh
      - -c
      - |
        /migrate -path=/migrations/problem-service -database "$${POSTGRES_DSN}&x-migrations-table=schema_migrations_problem" up && \
        /migrate -path=/migrations/submission-service -database "$${POSTGRES_DSN}&x-migrations-table=schema_migrations_submission" up && \
        /migrate -path=/migrations/progress-service -database "$${POSTGRES_DSN}&x-migrations-table=schema_migrations_progress" up && \
        /migrate -path=/migrations/assessment-service -database "$${POSTGRES_DSN}&x-migrations-table=schema_migrations_assessment" up

  redis:
    restart: always
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --requirepass ${REDIS_PASSWORD}
    # `ports: []` does not clear the base file's ports (Compose appends port
    # lists); they are kept off the internet by binding to 127.0.0.1 there.
    ports: []

  nats:
    restart: always
    ports: []   # see the redis note above

  # ─── Microservice overrides ───────────────────────────────────────────────
  problem-service:
    image: ${ECR_REGISTRY}/skillofide-problem-service:latest
    build: ~
    restart: always
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      # Redis runs with --requirepass; without this the cache silently stays off.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: warn

  execution-service:
    image: ${ECR_REGISTRY}/skillofide-execution-service:latest
    build: ~
    restart: always
    environment:
      PROBLEM_SERVICE_ADDR: problem-service:50051
      NATS_URL: ${NATS_URL}
      LOG_LEVEL: warn

  submission-service:
    image: ${ECR_REGISTRY}/skillofide-submission-service:latest
    build: ~
    restart: always
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      NATS_URL: ${NATS_URL}
      LOG_LEVEL: warn

  progress-service:
    image: ${ECR_REGISTRY}/skillofide-progress-service:latest
    build: ~
    restart: always
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: warn

  notification-service:
    image: ${ECR_REGISTRY}/skillofide-notification-service:latest
    build: ~
    restart: always
    environment:
      NATS_URL: ${NATS_URL}
      LOG_LEVEL: warn

  user-service:
    image: ${ECR_REGISTRY}/skillofide-user-service:latest
    build: ~
    restart: always
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      LOG_LEVEL: warn

  assessment-service:
    image: ${ECR_REGISTRY}/skillofide-assessment-service:latest
    build: ~
    restart: always
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      NATS_URL: ${NATS_URL}
      SUBMISSION_SERVICE_ADDR: submission-service:50053
      EXECUTION_SERVICE_ADDR: execution-service:50052
      GRPC_PORT: "50056"
      SWEEP_INTERVAL_SECONDS: "30"
      LOG_LEVEL: warn
    ports: []   # see the redis note above

  api-gateway:
    image: ${ECR_REGISTRY}/skillofide-api-gateway:latest
    build: ~
    restart: always
    environment:
      HTTP_PORT: "8080"
      PROBLEM_SERVICE_ADDR: problem-service:50051
      SUBMISSION_SERVICE_ADDR: submission-service:50053
      EXECUTION_SERVICE_ADDR: execution-service:50052
      PROGRESS_SERVICE_ADDR: progress-service:50054
      USER_SERVICE_ADDR: user-service:50055
      NOTIFICATION_SERVICE_URL: http://notification-service:8081
      ASSESSMENT_SERVICE_ADDR: assessment-service:50056
      # The gateway talks to Postgres directly for enquiries, scholarships,
      # certifications, attendance, payments and password reset. Without this
      # it starts with those endpoints silently disabled.
      DATABASE_URL: ${POSTGRES_DSN}
      # Where a candidate is sent to sit a test. Wrong value = dead links in
      # every scholarship, hiring and certification email.
      APP_BASE_URL: ${APP_BASE_URL}
      SITE_BASE_URL: ${SITE_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      INQUIRY_NOTIFY_TO: ${INQUIRY_NOTIFY_TO}
      SCHOLARSHIP_NOTIFY_TO: ${SCHOLARSHIP_NOTIFY_TO}
      CERTIFICATION_NOTIFY_TO: ${CERTIFICATION_NOTIFY_TO}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEV_MODE: "false"
      LOG_LEVEL: warn
      JSEARCH_API_KEY: ${JSEARCH_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
